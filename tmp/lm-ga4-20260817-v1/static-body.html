<div
  id="lm-analytics-consent"
  class="lm-consent"
  role="dialog"
  aria-modal="false"
  aria-labelledby="lm-consent-title"
  aria-describedby="lm-consent-description"
  hidden
>
  <div class="lm-consent__copy">
    <strong id="lm-consent-title">Măsurare statistică, doar cu acordul tău</strong>
    <p id="lm-consent-description">
      Folosim Google Analytics 4 ca să înțelegem ce pagini și acțiuni sunt utile.
      Nu trimitem conținutul formularelor, iar publicitatea și personalizarea rămân dezactivate.
    </p>
    <a href="/politica-de-confidentialitate/">Politica de confidențialitate și cookie-uri</a>
  </div>
  <div class="lm-consent__actions">
    <button type="button" class="lm-consent__accept" data-lm-consent="granted">
      Acceptă măsurarea
    </button>
    <button type="button" class="lm-consent__reject" data-lm-consent="denied">
      Continuă fără Analytics
    </button>
  </div>
</div>

<button
  id="lm-cookie-settings"
  class="lm-cookie-settings"
  type="button"
  aria-controls="lm-analytics-consent"
  aria-expanded="false"
  hidden
>
  Setări cookie
</button>

<noscript>
  <p class="lm-consent-noscript">
    JavaScript este dezactivat; Google Analytics nu este încărcat.
  </p>
</noscript>

<style>
  .lm-consent[hidden],
  .lm-cookie-settings[hidden] {
    display: none !important;
  }

  .lm-consent {
    position: fixed;
    z-index: 2147483000;
    left: max(16px, env(safe-area-inset-left));
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 22px;
    align-items: center;
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px;
    color: #10243d;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid rgba(16, 36, 61, 0.18);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(16, 36, 61, 0.24);
    backdrop-filter: blur(18px);
  }

  .lm-consent__copy strong {
    display: block;
    margin-bottom: 6px;
    font-size: 1.05rem;
  }

  .lm-consent__copy p {
    max-width: 720px;
    margin: 0 0 8px;
    color: #344a62;
    font-size: 0.94rem;
    line-height: 1.55;
  }

  .lm-consent__copy a {
    color: #075aa8;
    font-size: 0.9rem;
    font-weight: 700;
    text-underline-offset: 3px;
  }

  .lm-consent__actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 10px;
  }

  .lm-consent__actions button,
  .lm-cookie-settings {
    min-height: 44px;
    padding: 10px 15px;
    border-radius: 999px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  .lm-consent__accept {
    color: #fff;
    background: #075aa8;
    border: 2px solid #075aa8;
  }

  .lm-consent__reject {
    color: #17324f;
    background: #fff;
    border: 2px solid rgba(23, 50, 79, 0.3);
  }

  .lm-consent__actions button:focus-visible,
  .lm-cookie-settings:focus-visible {
    outline: 3px solid #f0b429;
    outline-offset: 3px;
  }

  .lm-cookie-settings {
    position: fixed;
    z-index: 2147482000;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    min-height: 38px;
    padding: 7px 12px;
    color: #17324f;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(23, 50, 79, 0.28);
    box-shadow: 0 7px 24px rgba(16, 36, 61, 0.16);
    font-size: 0.78rem;
  }

  .lm-consent-noscript {
    margin: 1rem;
    padding: 0.75rem;
    background: #fff8dc;
    border: 1px solid #e4c96f;
  }

  @media (max-width: 760px) {
    .lm-consent {
      grid-template-columns: 1fr;
      bottom: calc(88px + env(safe-area-inset-bottom));
      padding: 17px;
    }

    .lm-consent__actions {
      justify-content: stretch;
    }

    .lm-consent__actions button {
      flex: 1 1 100%;
    }

    .lm-cookie-settings {
      bottom: calc(82px + env(safe-area-inset-bottom));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lm-consent,
    .lm-cookie-settings {
      scroll-behavior: auto;
    }
  }
</style>

<script>
  (() => {
    const banner = document.getElementById("lm-analytics-consent");
    const settings = document.getElementById("lm-cookie-settings");
    if (!banner || !settings || !window.__lmAnalytics) return;

    const showBanner = () => {
      banner.hidden = false;
      settings.setAttribute("aria-expanded", "true");
      const preferred =
        banner.querySelector('[data-lm-consent="granted"]') ||
        banner.querySelector("button");
      if (preferred instanceof HTMLElement) preferred.focus({ preventScroll: true });
    };

    const hideBanner = () => {
      banner.hidden = true;
      settings.hidden = false;
      settings.setAttribute("aria-expanded", "false");
    };

    const currentChoice = window.__lmAnalytics.getChoice();
    if (currentChoice === "granted" || currentChoice === "denied") {
      hideBanner();
    } else {
      showBanner();
      settings.hidden = true;
    }

    banner.addEventListener("click", (event) => {
      if (!(event.target instanceof Element)) return;
      const button = event.target.closest("[data-lm-consent]");
      if (!(button instanceof HTMLButtonElement)) return;
      const choice = button.dataset.lmConsent;
      window.__lmAnalytics.setChoice(choice);
      hideBanner();

      if (choice === "granted" && window.gtag) {
        window.gtag("event", "consent_update", {
          consent_choice: "analytics_granted",
          page_path: window.location.pathname,
        });
      }
    });

    settings.addEventListener("click", () => {
      showBanner();
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Escape" &&
        !banner.hidden &&
        window.__lmAnalytics.getChoice()
      ) {
        hideBanner();
        settings.focus();
      }
    });

    const safeText = (value) =>
      String(value || "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 100);

    const elementLocation = (element) => {
      if (element.closest("header, .hero")) return "header";
      if (element.closest("nav")) return "navigation";
      if (element.closest("footer")) return "footer";
      if (element.closest(".sticky-action-bar")) return "sticky_bar";
      return "content";
    };

    const safeDestination = (anchor) => {
      try {
        const url = new URL(anchor.href, window.location.href);
        if (url.protocol === "tel:") return "phone";
        if (
          url.hostname === "wa.me" ||
          url.hostname.endsWith("whatsapp.com")
        ) {
          return "whatsapp";
        }
        return url.origin === window.location.origin
          ? url.pathname
          : url.hostname;
      } catch {
        return "unknown";
      }
    };

    const send = (name, params) => {
      if (!window.__lmAnalytics.isGranted() || !window.gtag) return;
      window.gtag("event", name, {
        page_path: window.location.pathname,
        ...params,
      });
    };

    document.addEventListener(
      "click",
      (event) => {
        if (!(event.target instanceof Element)) return;
        const element = event.target.closest("a,button");
        if (!(element instanceof HTMLElement)) return;
        if (element.closest("#lm-analytics-consent, #lm-cookie-settings")) return;

        const anchor = element instanceof HTMLAnchorElement
          ? element
          : element.closest("a");
        const href = anchor?.getAttribute("href") || "";
        const label = safeText(
          element.getAttribute("aria-label") ||
            element.innerText ||
            element.textContent,
        );
        const common = {
          cta_text: label || "fără etichetă",
          cta_location: elementLocation(element),
          destination: anchor ? safeDestination(anchor) : "button",
        };

        if (/^tel:/i.test(href)) {
          send("phone_click", common);
          send("generate_lead", { ...common, lead_channel: "phone" });
        } else if (
          /^https?:\/\/(?:wa\.me|(?:api\.)?whatsapp\.com)/i.test(href)
        ) {
          send("whatsapp_click", common);
          send("generate_lead", { ...common, lead_channel: "whatsapp" });
        } else if (
          anchor &&
          new URL(anchor.href, window.location.href).pathname
            .replace(/\/+$/, "") === "/contact"
        ) {
          send("contact_click", common);
        }

        if (
          element.matches(
            ".cta-button, .nav-cta, .sticky-btn, [data-cta], .btn, [class*='cta']",
          )
        ) {
          send("cta_click", common);
        }
      },
      { capture: true },
    );

    document.addEventListener(
      "submit",
      (event) => {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        const fingerprint = safeText(
          [
            form.id,
            form.getAttribute("name"),
            form.getAttribute("action"),
            form.className,
            window.location.pathname,
          ].join(" "),
        );
        const params = {
          form_id: fingerprint || "contact_form",
          lead_channel: "form",
        };
        send("booking_request", params);
        send("generate_lead", params);
      },
      { capture: true },
    );
  })();
</script>
